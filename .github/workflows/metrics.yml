name: Metrics

on:
  # Daily refresh
  schedule: [{cron: "0 0 * * *"}]
  # Run manually from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          # 960px wide canvas so the calendar gets room
          config_display: large
          base: header
          base_indepth: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Drop the name/avatar, graph on the left, stats stacked on the right
          extras_css: |
            h1.field{display:none}
            .items-wrapper{position:relative;display:block;height:100%}
            .items-wrapper>section:nth-of-type(1){position:absolute;top:0;right:0;width:400px}
            .items-wrapper>section:nth-of-type(1)>.row{display:block;margin:0}
            .items-wrapper>section:nth-of-type(1)>.row>section{display:block;margin:0 0 14px}
            .items-wrapper>section:nth-of-type(2)>.row{position:absolute;top:110px;right:0;width:400px;display:block;margin:0}
            .items-wrapper>section:nth-of-type(2)>.row>section:nth-of-type(1){display:none}
            .items-wrapper>section:nth-of-type(2)>svg[version]{width:500px!important;height:auto!important;margin:0!important;display:block}
