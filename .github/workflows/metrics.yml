name: Metrics

on:
  # Daily refresh
  schedule: [{cron: "0 0 * * *"}]
  # Run manually from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header
          base_indepth: yes
          plugin_isocalendar: yes
          # Drop the name/avatar, calendar on the left, stats on the right
          extras_css: |
            h1.field{display:none}
            .items-wrapper{position:relative;display:block}
            .items-wrapper>section:nth-of-type(1){position:absolute;top:0;right:0;width:196px;font-size:12px}
            .items-wrapper>section:nth-of-type(1)>.row{display:block;margin:0}
            .items-wrapper>section:nth-of-type(1)>.row>section{display:block;margin:0 0 10px}
            .items-wrapper>section:nth-of-type(2){width:278px}
            .items-wrapper>section:nth-of-type(2)>.row{position:absolute;top:104px;right:0;width:196px;display:block;margin:0;font-size:12px}
            .items-wrapper>section:nth-of-type(2)>.row>section:nth-of-type(1){display:none}
            .items-wrapper>section:nth-of-type(2)>svg[version]{width:278px!important;height:auto!important;margin:0!important;display:block}
