name: Metrics

on:
  # Daily refresh
  schedule: [{cron: "0 0 * * *"}]
  # Run manually from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header
          base_indepth: yes
          plugin_isocalendar: yes
          # Drop the name/avatar, calendar on the left, stats on the right.
          # Grid (not absolute) so metrics still measures the real height.
          extras_css: |
            h1.field{display:none}
            .items-wrapper{display:grid;grid-template-columns:auto 200px;column-gap:12px;align-items:start}
            .items-wrapper>section{display:contents}
            .items-wrapper>section>.row{display:contents}
            .items-wrapper>section:nth-of-type(1)>.row>section{grid-column:2;font-size:12px}
            .items-wrapper>section:nth-of-type(1)>.row>section:nth-of-type(1){grid-row:1}
            .items-wrapper>section:nth-of-type(1)>.row>section:nth-of-type(2){grid-row:2}
            .items-wrapper .calendar svg{width:100%!important;height:auto!important}
            .items-wrapper>section:nth-of-type(2)>.row>section:nth-of-type(1){display:none}
            .items-wrapper>section:nth-of-type(2)>.row>section:nth-of-type(2){grid-column:2;grid-row:3;font-size:12px}
            h2.field{grid-column:1;grid-row:1;margin:0 0 4px}
            .items-wrapper>section:nth-of-type(2)>svg[version]{grid-column:1;grid-row:2/span 2;width:100%!important;height:auto!important;margin:0!important;display:block}
