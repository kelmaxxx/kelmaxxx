name: Metrics

on:
  # Daily refresh
  schedule: [{cron: "0 0 * * *"}]
  # Run manually from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          # 960px canvas so the card fills the profile column
          config_display: large
          base: header
          base_indepth: yes
          plugin_isocalendar: yes
          # default padding is 11% of the height, which leaves a dead band at the bottom
          config_padding: 0, 6 + 2%
          # No name/avatar, calendar on the left, stats on the right.
          # Grid (never absolute positioning) so metrics still measures the real height.
          # The calendar svg draws in a 480-unit viewBox but only uses ~231 units, so it is
          # rendered at 1230px and the empty right side is clipped at the column edge.
          # That is what makes the graph big without cutting the plane.
          extras_css: |
            h1.field{display:none}
            .items-wrapper{display:grid;grid-template-columns:minmax(0,1fr) 300px;column-gap:16px;align-items:start;align-content:start;box-sizing:border-box;width:100%!important;max-width:100%!important}
            .items-wrapper>section{display:contents}
            .items-wrapper>section:nth-of-type(1)>.row{display:block;grid-column:2;grid-row:1;font-size:17px}
            .items-wrapper>section:nth-of-type(2)>.row{display:block;grid-column:2;grid-row:2;font-size:17px}
            .items-wrapper>section:nth-of-type(2)>.row>section:nth-of-type(1){display:none}
            .items-wrapper .calendar{display:none}
            .items-wrapper .field{margin:22px 2px!important;white-space:nowrap}
            .items-wrapper h3.field{margin:44px 2px 12px 2px!important}
            h2.field{grid-column:1;grid-row:1;margin:0 0 6px 2px!important;font-size:18px}
            .items-wrapper>section:nth-of-type(2)>svg[version]{grid-column:1;grid-row:2;width:1230px!important;min-width:0!important;max-width:none!important;height:auto!important;margin:0!important;display:block}
